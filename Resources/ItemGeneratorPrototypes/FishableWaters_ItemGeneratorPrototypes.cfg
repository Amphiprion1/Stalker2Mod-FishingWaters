// Adds test baits onto the prologue loadout.
// {bpatch} nodes are validated on their own: SID and Category must be present
// even when the field already exists on the vanilla prototype.
// Does not replace [0] Gun_SkifGun_HG.
E01_MQ01_PlayerItemGenerator : struct.begin {bpatch}
   SID = E01_MQ01_PlayerItemGenerator
   ItemGenerator : struct.begin {bpatch}
      [3] : struct.begin {bpatch}
         Category = EItemGenerationCategory::Consumable
         PossibleItems : struct.begin {bpatch}
            [*] : struct.begin
               ItemPrototypeSID = FW_Bait_Worm
               Chance = 1
               MinCount = 5
               MaxCount = 5
            struct.end
            [*] : struct.begin
               ItemPrototypeSID = FW_Bait_Meat
               Chance = 1
               MinCount = 5
               MaxCount = 5
            struct.end
            [*] : struct.begin
               ItemPrototypeSID = FW_Bait_Deep
               Chance = 1
               MinCount = 2
               MaxCount = 2
            struct.end
         struct.end
      struct.end
   struct.end
struct.end
