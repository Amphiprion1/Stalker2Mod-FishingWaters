// Adds test tackle onto the prologue loadout.
// {bpatch} nodes are validated on their own: SID and Category must be present
// even when the field already exists on the vanilla prototype.
// Does not replace [0] Gun_SkifGun_HG. Rod is an extra WeaponSecondary slot.
E01_MQ01_PlayerItemGenerator : struct.begin {bpatch}
   SID = E01_MQ01_PlayerItemGenerator
   ItemGenerator : struct.begin {bpatch}
      [3] : struct.begin {bpatch}
         Category = EItemGenerationCategory::Consumable
         PossibleItems : struct.begin {bpatch}
            [*] : struct.begin
               ItemPrototypeSID = FW_Bait_Worm
               Chance = 1
               MinCount = 5
               MaxCount = 5
            struct.end
            [*] : struct.begin
               ItemPrototypeSID = FW_Bait_Meat
               Chance = 1
               MinCount = 5
               MaxCount = 5
            struct.end
         struct.end
      struct.end
      [4] : struct.begin {bpatch}
         Category = EItemGenerationCategory::Ammo
         PossibleItems : struct.begin {bpatch}
            [*] : struct.begin
               ItemPrototypeSID = FW_Hook
               Chance = 1
               MinCount = 30
               MaxCount = 30
               bRequireWeapon = false
            struct.end
         struct.end
      struct.end
      [5] : struct.begin
         Category = EItemGenerationCategory::WeaponSecondary
         PossibleItems : struct.begin
            [0] : struct.begin
               ItemPrototypeSID = FW_FishingRod_Wep
               Weight = 1000
               MinDurability = 1
               MaxDurability = 1
               AmmoMinCount = 0
               AmmoMaxCount = 0
            struct.end
         struct.end
      struct.end
   struct.end
struct.end
