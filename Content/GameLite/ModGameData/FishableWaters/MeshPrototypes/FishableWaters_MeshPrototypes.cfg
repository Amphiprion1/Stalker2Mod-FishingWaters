// World (dropped) mesh. Pivot at mid-rod so the pickup point is in the middle.
// Refkey is a vanilla weapon world mesh (no inherited material).
FW_FishingRod_Mesh : struct.begin {refurl=@BaseGame/MeshPrototypes.cfg;refkey=GunGauss_StaticMesh}
	SID = FW_FishingRod_Mesh
	MeshPath = StaticMesh'/FishableWaters/Actors/SM_FW_FishingRod_World.SM_FW_FishingRod_World'
struct.end

// First-person body. SK_FW_Gauss is a duplicate of vanilla SK_gauss.
// refkey is a named skeletal prototype (Gauss_Skeletal is indexed, so it cannot be a refkey).
// MaterialPath matches vanilla Gauss_Skeletal so the coil look does not change yet.
FW_Rod_Gauss : struct.begin {refurl=@BaseGame/MeshPrototypes.cfg;refkey=rpg7_Skeletal}
	SID = FW_Rod_Gauss
	MeshPath = SkeletalMesh'/FishableWaters/Actors/SK_FW_Gauss.SK_FW_Gauss'
	MaterialPath = MaterialInstanceConstant'/Game/_STALKER2/SkeletalMeshes/weapons/ar/AK74/MI_AK74_Base.MI_AK74_Base'
	MeshType = EMeshSubType::Skeletal
struct.end

// Duplicated Gauss huge-mag meshes. The weapon wires only FW_Rod_MagFull
// (CompatibleAttachments has MeshPrototypeSID, no empty-mesh field).
FW_Rod_MagFull : struct.begin {refurl=@BaseGame/MeshPrototypes.cfg;refkey=GunGauss_MagIncreasedFull}
	SID = FW_Rod_MagFull
	MeshPath = StaticMesh'/FishableWaters/Actors/SM_sr_gauss_mag_increased_full.SM_sr_gauss_mag_increased_full'
struct.end

FW_Rod_MagEmpty : struct.begin {refurl=@BaseGame/MeshPrototypes.cfg;refkey=GunGauss_MagIncreasedEmpty}
	SID = FW_Rod_MagEmpty
	MeshPath = StaticMesh'/FishableWaters/Actors/SM_sr_gauss_mag_increased_empty.SM_sr_gauss_mag_increased_empty'
struct.end