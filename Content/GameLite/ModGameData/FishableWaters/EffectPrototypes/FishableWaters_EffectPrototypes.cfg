// CameraShake hook: Utiliser on FW_FishingRod runs BP_FW_FishingRodUse (Print / fishing FSM).
// Inherit ConcussionCameraShake so schema (ValueProviderSID, etc.) is complete — bare CameraShake struct fails ModKit parse.
FW_FishingRodUseEffect : struct.begin {refurl=@BaseGame/EffectPrototypes.cfg;refkey=ConcussionCameraShake}
   SID = FW_FishingRodUseEffect
   CameraShakePrototypeSID = FW_FishingRodShake
   ValueMin = 1.0
   ValueMax = 1.0
   ValueProviderSID = Empty
struct.end

// Bait Use → CameraShake → BP BeginPlay writes ActiveBait. Same schema as FW_FishingRodUseEffect.
// Value stays 1 so the effect is applied (a 0 value can be skipped). Visible shake is Scale/BP amplitude, not this value.
FW_Effect_BaitWorm : struct.begin {refurl=@BaseGame/EffectPrototypes.cfg;refkey=ConcussionCameraShake}
   SID = FW_Effect_BaitWorm
   CameraShakePrototypeSID = FW_CamShake_BaitWorm
   Duration = 0.2
   Charges = 1
   ValueMin = 1.0
   ValueMax = 1.0
   ValueProviderSID = Empty
struct.end

FW_Effect_BaitMeat : struct.begin {refurl=@BaseGame/EffectPrototypes.cfg;refkey=ConcussionCameraShake}
