// Hook — the rod's only ammo. Baits are consumables (FW_Bait_Worm / FW_Bait_Meat), not ammo.
// EAmmoCaliber has no free enumerator (native list ends at AVOG / None / GetCount).
// A045 is the caliber already declared on FW_FishingRod_Wep. Exclusivity is FittingWeaponsSIDs
// (this hook lists only the rod; vanilla A045 packs do not list the rod). Do not reintroduce
// FW_Bait / FW_Bait_B as ammo — that was the retired ammo-type switch.
FW_Hook : struct.begin {refurl=@BaseGame/ItemPrototypes/AmmoPrototypes.cfg;refkey=TemplateAmmo}
   SID = FW_Hook
   LocalizationSID = FW_Hook
   Type = EItemType::Ammo
   Weight = 0.001
   Cost = 5.0
   ItemGridWidth = 1
   ItemGridHeight = 1
   MaxStackCount = 99
   Caliber = EAmmoCaliber::A045
   AmmoType = EAmmoType::Default
   AmmoPackCount = 1
   FractionCount = 1
   DamageMod = 0.0
   ArmorPiercingMod = 0.0
   ArmorDamageMod = 0.0
   BleedingMod = 0.0
   DamageSource = EDamageSource::Bullet
   Icon = Texture2D'/FishableWaters/Textures/Icons/T_FW_Perch.T_FW_Perch'
   Icon1x1 = Texture2D'/FishableWaters/Textures/Icons/T_FW_Perch.T_FW_Perch'
   MeshPrototypeSID = DeadFish
   PhysicsInteractionPrototypeSID = Ammo_S
   FittingWeaponsSIDs : struct.begin
      [0] = FW_FishingRod_Wep
   struct.end
struct.end
