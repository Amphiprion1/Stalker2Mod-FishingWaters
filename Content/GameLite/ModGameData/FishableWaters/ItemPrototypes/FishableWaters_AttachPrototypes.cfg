// Rod mag. Same vanilla GunGauss_Scar_MagHuge stats (MaxAmmo 99 inherited).
// MeshArray is the mesh the gun renders. {bskipref} replaces the vanilla Full/Empty pair.
// FittingWeaponsSIDs left inherited: the rod fits this mag from its own CompatibleAttachments list.
FW_Rod_Mag : struct.begin {refurl=@BaseGame/ItemPrototypes/AttachPrototypes.cfg;refkey=GunGauss_Scar_MagHuge}
   SID = FW_Rod_Mag
   Magazine : struct.begin
      MeshArray : struct.begin {bskipref}
         [0] : struct.begin
            MeshPrototypeSID = FW_Rod_MagFull
            MagazineMeshType = EMagazineMeshType::Full
         struct.end
         [1] : struct.begin
            MeshPrototypeSID = FW_Rod_MagEmpty
            MagazineMeshType = EMagazineMeshType::Empty
         struct.end
      struct.end
   struct.end
struct.end
