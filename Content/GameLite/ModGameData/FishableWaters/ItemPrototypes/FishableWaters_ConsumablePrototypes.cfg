// Baits. Use (ConsumeOnUse) runs one CameraShake effect that sets ActiveBait.
// Inherit TemplateConsumable so Bread's satiety / heal / radiation arrays are not copied.
// An empty {bskipref} struct is parsed as a child with no SID and fails EnsureNoEntryChildNotExist.
// Meshes are placeholders: sausage = worm, canned food = meat.

FW_Bait_Worm : struct.begin {refurl=@BaseGame/ItemPrototypes/ConsumablePrototypes.cfg;refkey=TemplateConsumable}
   SID = FW_Bait_Worm
   LocalizationSID = FW_Bait_Worm
   Type = EItemType::Consumable
   Usable = true
   ConsumeOnUse = true
   ConsumableType = EConsumableType::None
   UIUseSound = EUISound::UseConsumableSausage
   InventoryActionTime = 0.8
   MaxStackCount = 30
   Weight = 0.05
   Cost = 10.0
   ItemGridWidth = 1
   ItemGridHeight = 1
   SortGroup = ESortGroup::None
   SortPriority = 0
   Icon = Texture2D'/Game/GameLite/FPS_Game/UIRemaster/UITextures/Inventory/Consumable/T_cns_sausage_02.T_cns_sausage_02'
   Icon1x1 = Texture2D'/Game/GameLite/FPS_Game/UIRemaster/UITextures/Inventory/Consumable/T_cns_sausage_02.T_cns_sausage_02'
   MeshPrototypeSID = Sausage
   MeshPath = SkeletalMesh'/Game/_STALKER2/SkeletalMeshes/item/sausage/fp/SK_sausage_fp.SK_sausage_fp'
   AnimBlueprint = AnimBlueprint'/Game/_STALKER2/Animations/item/sausage/fp/AnimBP_Sausage.AnimBP_Sausage'
   bIsUsesRightHand = true
   PhysicsInteractionPrototypeSID = FoodSoftItem
   EffectPrototypeSIDs : struct.begin {bskipref}
      [0] = FW_Effect_BaitWorm
   struct.end
   ShouldShowEffects : struct.begin {bskipref}
      [0] = false
   struct.end
   EffectsDisplayTypes : struct.begin {bskipref}
      [0] = EEffectDisplayType::EffectLevel
   struct.end
struct.end

