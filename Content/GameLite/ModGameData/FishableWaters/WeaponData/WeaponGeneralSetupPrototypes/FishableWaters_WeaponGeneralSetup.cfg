// Rebased onto GunRpg7_GL: native MaxAmmo=1, AttachPrototypeSID=empty (no mag), no Compatible/Preinstalled mag.
// AmmoCaliber stays A045 (working loc/HUD). Projectiles use vanilla empty (Speed=0) - never PPG7V.
FW_FishingRod_Wep : struct.begin {refurl=@BaseGame/WeaponData/WeaponGeneralSetupPrototypes.cfg;refkey=GunRpg7_GL}
   SID = FW_FishingRod_Wep
   MaxAmmo = 1
   MaxJamChance = 0.0
   ShootCameraShakePrototypeSID = FW_FishingRodShake
   MinDeadNPCLoadedAmmoCount = 0
   MaxDeadNPCLoadedAmmoCount = 0
   // A045: native enum has no rod-only value. Only FW_Hook lists this weapon in FittingWeaponsSIDs.
   AmmoCaliber = EAmmoCaliber::A045
   // Default only. The ArmorPiercing slot existed for retired ammo FW_Bait_B.
   AmmoTypeProjectiles : struct.begin {bskipref}
      [0] : struct.begin
         AmmoType = EAmmoType::Default
         ProjectilePrototypeSID = empty
      struct.end
   struct.end
   PerBulletReloadingAmmoCount = 0
   ReloadTypes : struct.begin
      [0] = EAnimationReloadTypes::Full
   struct.end
   // Like RPG: single entry, AttachPrototypeSID = empty (no detachable mag / no 8s UDP fallback).
   WeaponReloadTimePerAttachment : struct.begin {bskipref}
      [0] : struct.begin
         AttachPrototypeSID = empty
         TacticalReloadTimeMultiplier = 1.0
         FullReloadTimeMultiplier = 1.0
         SingleBulletReloadTimeMultiplier = 1.0
         UnloadTime = 0.0
      struct.end
   struct.end
   // Silence RPG boom (vanilla empty event syntax).
   FireEventOneShot = AkAudioEvent''
   LastShootIdle = true
   bSpawnShell = false
   // Clear RPG rocket / hammer / ring static parts so FP does not show a rocket on jnt_ammo_move.
   WeaponStaticMeshParts : struct.begin {bskipref}
   struct.end
struct.end