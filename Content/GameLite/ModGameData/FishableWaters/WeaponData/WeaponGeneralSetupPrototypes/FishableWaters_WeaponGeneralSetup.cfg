// Rebased onto GunGauss_Scar_SP (2026-09-27). Mag is FW_Rod_Mag (child of the Scar huge mag, MaxAmmo 99) so the battery meshes can be swapped.
// Reload anim was tied to the vanilla mag SID. FW_Rod_Mag is a child of that mag; if the reload loses its animation, that is why.
// AmmoCaliber stays A045 (caliber lives on weapon + ammo, not on the mag). Projectile = vanilla empty (Speed=0), never PGA.
FW_FishingRod_Wep : struct.begin {refurl=@BaseGame/WeaponData/WeaponGeneralSetupPrototypes.cfg;refkey=GunGauss_Scar_SP}
   SID = FW_FishingRod_Wep
   MaxAmmo = 99
   MinJamChance = 0.0
   MaxJamChance = 0.0
   ShootCameraShakePrototypeSID = FW_FishingRodShake
   MinDeadNPCLoadedAmmoCount = 0
   MaxDeadNPCLoadedAmmoCount = 0
   // A045: native enum has no rod-only value. Only FW_Hook lists this weapon in FittingWeaponsSIDs.
   AmmoCaliber = EAmmoCaliber::A045
   // Default only. The ArmorPiercing slot existed for retired ammo FW_Bait_B.
   AmmoTypeProjectiles : struct.begin {bskipref}
      [0] : struct.begin
         AmmoType = EAmmoType::Default
         ProjectilePrototypeSID = empty
      struct.end
   struct.end
   PerBulletReloadingAmmoCount = 0
   // Single cast per trigger pull (same pattern as vanilla GunArevPrecise_AR_GS).
   FireTypes : struct.begin {bskipref}
      [0] = EFireType::SemiAutomatic
   struct.end
   DefaultFireType = EFireType::SemiAutomatic
   // ReloadTypes not overridden: inherits Full + Tactical from the Gauss (TemplateSniper).
   WeaponReloadTimePerAttachment : struct.begin {bskipref}
      [0] : struct.begin
         AttachPrototypeSID = FW_Rod_Mag
         TacticalReloadTimeMultiplier = 1.0
         FullReloadTimeMultiplier = 1.0
         SingleBulletReloadTimeMultiplier = 1.0
         UnloadTime = 0.0
      struct.end
   struct.end
   // {bskipref} so the parent Gauss scope / muzzle / laser are NOT compatible or preinstalled.
   CompatibleAttachments : struct.begin {bskipref}
      [0] : struct.begin
         AttachPrototypeSID = FW_Rod_Mag
         Socket = jnt_clip_base
         IconPosX = 0
         IconPosY = 0
         WeaponSpecificIcon = Texture2D'/Game/GameLite/FPS_Game/UIRemaster/UITextures/Inventory/WeaponAndAttachments/Gauss/T_inv_w_gauss_magincreased.T_inv_w_gauss_magincreased'
      struct.end
   struct.end
   PreinstalledAttachmentsItemPrototypeSIDs : struct.begin {bskipref}
      [0] : struct.begin
         AttachSID = FW_Rod_Mag
         bHiddenInInventory = true
      struct.end
   struct.end
   // Silence Gauss shot (vanilla empty event syntax).
   FireEventOneShot = AkAudioEvent''
   LastShootIdle = false
   bSpawnShell = false
   // No Gauss ammo screen widget on the rod.
   DisplayBP = Blueprint''
   // Replace all Gauss static parts with the rod mesh on jnt_offset.
   WeaponStaticMeshParts : struct.begin {bskipref}
      [0] : struct.begin
         MeshPath = StaticMesh'/FishableWaters/Actors/SM_FW_FishingRod.SM_FW_FishingRod'
         SocketName = jnt_l_hand
      struct.end
   struct.end
struct.end